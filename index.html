<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DalalQuant — Indian Markets Terminal</title>
<meta name="description" content="DalalQuant: investing, trading and algo-trading terminal for NSE/BSE — rankings, screener, fundamentals, intrinsic value, F&O option chain and strategy builder, backtesting and broker connectivity.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e13;--p:#10161e;--p2:#151d27;--p3:#1a2430;--ln:#223040;--tx:#e6edf3;--mu:#8b98a5;--up:#22c55e;--dn:#ef4444;--ac:#3b82f6;--wa:#f59e0b;--vi:#a78bfa;--cy:#22d3ee}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
.mono,td.n,.n{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
header.top{display:flex;gap:12px;align-items:center;padding:8px 14px;background:#0c1218;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:30}
.brand{font-weight:700;font-size:17px;white-space:nowrap;letter-spacing:-.01em}.brand b{color:var(--ac)}.brand small{color:var(--mu);font-weight:500;margin-left:8px;font-size:11px}
#search{flex:1;max-width:440px}
.spacer{flex:1}
#clock{color:var(--mu);font-size:12px;white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.b-sim{background:#3a2a07;color:#fbbf24;border:1px solid #6b4f12}.b-live{background:#06301a;color:#4ade80;border:1px solid #11643a}.b-csv{background:#14233d;color:#93c5fd;border:1px solid #23406e}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;background:var(--p3);color:var(--mu);margin:1px 2px 1px 0;border:1px solid var(--ln)}
#banner{background:#2a1f06;color:#fcd34d;border-bottom:1px solid #6b4f12;padding:6px 14px;font-size:12px}
#banner b{color:#fde68a}
.shell{display:flex;min-height:calc(100vh - 52px)}
nav#nav{width:184px;flex:none;border-right:1px solid var(--ln);padding:10px 8px;display:flex;flex-direction:column;gap:2px;background:#0c1218;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
nav#nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:7px;color:var(--mu);font-weight:500;display:flex;gap:9px;align-items:center}
nav#nav button:hover{background:var(--p2);color:var(--tx)}
nav#nav button.on{background:#13243d;color:#fff}
nav#nav .ico{width:16px;text-align:center;opacity:.85}
nav#nav .foot{margin-top:auto;font-size:11px;color:var(--mu);padding:8px 10px;line-height:1.5}
main{flex:1;padding:14px;min-width:0}
section.tab{display:none}section.tab.on{display:block}
.card{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin-bottom:12px;min-width:0}
.card>h3,.h3{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h3 .r{margin-left:auto}
.g2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:12px}
.g2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.idxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.ic{background:var(--p2);border:1px solid var(--ln);border-radius:9px;padding:8px 10px;cursor:pointer}
.ic:hover{border-color:#35516f}.ic .nm{font-size:11px;color:var(--mu);font-weight:600}.ic .lv{font-size:16px;font-weight:600;margin-top:2px}.ic canvas{height:30px;margin-top:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.kv>div{background:var(--p2);border:1px solid var(--ln);border-radius:7px;padding:6px 8px}
.kv .k{font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}.kv .v{font-family:'JetBrains Mono',monospace;font-size:13.5px;margin-top:1px}
.tw{overflow:auto;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{position:sticky;top:0;background:var(--p2);color:var(--mu);font-weight:600;text-align:left;padding:6px 7px;border-bottom:1px solid var(--ln);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
table.t th.n,table.t td.n{text-align:right}
table.t th[data-sort]{cursor:pointer}table.t th[data-sort]:hover{color:var(--tx)}
table.t td{padding:5px 7px;border-bottom:1px solid #18222e;white-space:nowrap}
table.t tr.cl{cursor:pointer}table.t tr.cl:hover td{background:#131c27}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}.wa{color:var(--wa)}
input,select,textarea{background:#0c1218;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;font:inherit;min-width:0}
input:focus,select:focus,textarea:focus{outline:1px solid var(--ac);border-color:var(--ac)}
input[type=number]{width:90px}input.w60{width:64px}input.w120{width:120px}
textarea{width:100%;font-family:'JetBrains Mono',monospace;font-size:12px}
label.f{display:inline-flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mu);margin:0 10px 8px 0}
label.c{display:inline-flex;gap:6px;align-items:center;margin-right:12px;color:var(--mu);font-size:12px;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:600;font:inherit;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}.btn.s{background:var(--p3);color:var(--tx);border:1px solid var(--ln)}.btn.g{background:#15803d}.btn.r{background:#b91c1c}.btn.xs{padding:3px 8px;font-size:11.5px}
.btn.on{background:#13243d;border-color:var(--ac);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:700;font-size:11.5px;letter-spacing:.03em}
.v-buy{background:#06301a;color:#4ade80;border:1px solid #11643a}.v-hold{background:#0f2541;color:#93c5fd;border:1px solid #23406e}.v-wait{background:#3a2a07;color:#fbbf24;border:1px solid #6b4f12}.v-exit{background:#3b0d0d;color:#fca5a5;border:1px solid #7f1d1d}
.sbar{display:inline-block;width:62px;height:6px;background:#1f2a37;border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}.sbar i{display:block;height:100%}
.hm{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}.hm div{border-radius:7px;padding:8px;cursor:pointer;font-size:12px}.hm b{display:block;font-size:14px}
canvas{width:100%;display:block}
.chart{height:380px}.chart2{height:220px}.chart3{height:260px}
.readout{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mu);min-height:16px;margin:4px 0}
.reason{display:flex;gap:7px;padding:3px 0;font-size:12.5px}.reason .i{width:14px;flex:none}
.compbar{display:grid;grid-template-columns:86px 1fr 34px;gap:6px;align-items:center;font-size:12px;margin:3px 0}.compbar .b{height:7px;background:#1f2a37;border-radius:4px;overflow:hidden}.compbar .b i{display:block;height:100%}
.big{font-size:26px;font-weight:700;font-family:'JetBrains Mono',monospace}
.sub{color:var(--mu);font-size:12px}
.tabs2{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;border-bottom:1px solid var(--ln);padding-bottom:6px}
.tabs2 button{all:unset;cursor:pointer;padding:5px 10px;border-radius:6px;color:var(--mu);font-weight:500;font-size:12.5px}.tabs2 button.on{background:#13243d;color:#fff}
.opp{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.oc{background:linear-gradient(180deg,#0f2a1c,#0f1a14);border:1px solid #1d5c3a;border-radius:9px;padding:10px;cursor:pointer}.oc:hover{border-color:#2fa064}
.oc .s{font-weight:700;font-size:14px}.oc .why{font-size:11.5px;color:#a7c4b3;margin-top:4px}
pre.code{background:#0c1218;border:1px solid var(--ln);border-radius:7px;padding:10px;overflow:auto;font-size:11.5px;line-height:1.5;color:#cbd5e1;white-space:pre}
.note{font-size:11.5px;color:var(--mu);margin-top:6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:60px 14px;overflow:auto}
#modal .box{background:var(--p);border:1px solid var(--ln);border-radius:12px;max-width:820px;width:100%;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#toast{position:fixed;bottom:18px;right:18px;background:#13243d;border:1px solid var(--ac);color:#fff;padding:9px 14px;border-radius:8px;display:none;z-index:60;max-width:360px}
.chain td{padding:3px 6px;font-size:12px}.chain td.k{background:#131c27;font-weight:700;text-align:center}.chain td.itm{background:#13202a}.chain td.px{cursor:pointer;text-decoration:underline dotted}.chain td.px:hover{background:#1d3550}
.oibar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-left:4px}
.heat td{text-align:center;font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:4px}
.star{cursor:pointer;color:#475569;font-size:14px}.star.on{color:#fbbf24}
.err{color:#fca5a5}
#tape{background:#0c1218;border-bottom:1px solid var(--ln);overflow:hidden;white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:11.5px;height:24px;line-height:24px}
#tapeIn{display:inline-block;padding-left:100%;animation:tape 120s linear infinite}#tape:hover #tapeIn{animation-play-state:paused}
#tapeIn span{margin-right:26px;cursor:pointer}@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-100%)}}
#flash{display:none;background:#2a0d0d;border-bottom:1px solid #7f1d1d;color:#fecaca;font-size:12.5px;padding:5px 14px}#flash b{color:#fff}
.pulse{font-size:14px;line-height:1.7}.pulse b{color:#fff}
.news{display:grid;gap:8px}.ni{background:var(--p2);border:1px solid var(--ln);border-left:3px solid var(--mu);border-radius:8px;padding:8px 10px}.ni.high{border-left-color:#ef4444}.ni.med{border-left-color:#f59e0b}.ni.low{border-left-color:#3b82f6}
.ni a{color:var(--tx);font-weight:600;font-size:13.5px}.ni .meta{font-size:11px;color:var(--mu);margin-top:3px}
.cue{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #18222e;font-size:12.5px}.cue .d{width:16px;flex:none;font-weight:700}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
@media(max-width:1000px){.shell{flex-direction:column}nav#nav{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln)}nav#nav .foot{display:none}nav#nav button{white-space:nowrap}.g2,.g2e,.g3{grid-template-columns:minmax(0,1fr)}.brand small{display:none}#clock{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">◆ Dalal<b>Quant</b><small>NSE · BSE terminal</small></div>
  <input id="search" list="symlist" placeholder="Search symbol or company…  (e.g. RELIANCE, HDFCBANK)" autocomplete="off">
  <datalist id="symlist"></datalist>
  <span class="spacer"></span>
  <span id="bell" data-tab="alerts" style="cursor:pointer" title="Alerts">🔔</span>
  <span id="modeBadge"></span>
  <span id="clock"></span>
</header>
<div id="banner"></div>
<div id="tape"><div id="tapeIn"></div></div>
<div id="flash"></div>
<div class="shell">
  <nav id="nav"></nav>
  <main>
    <section class="tab" id="tab-markets"></section>
    <section class="tab" id="tab-mood"></section>
    <section class="tab" id="tab-world"></section>
    <section class="tab" id="tab-news"></section>
    <section class="tab" id="tab-cap"></section>
    <section class="tab" id="tab-rankings"></section>
    <section class="tab" id="tab-screener"></section>
    <section class="tab" id="tab-enquiry"></section>
    <section class="tab" id="tab-ai"></section>
    <section class="tab" id="tab-analyze"></section>
    <section class="tab" id="tab-intraday"></section>
    <section class="tab" id="tab-inst"></section>
    <section class="tab" id="tab-quant"></section>
    <section class="tab" id="tab-quantp"></section>
    <section class="tab" id="tab-backtest"></section>
    <section class="tab" id="tab-options"></section>
    <section class="tab" id="tab-foa"></section>
    <section class="tab" id="tab-funds"></section>
    <section class="tab" id="tab-portfolio"></section>
    <section class="tab" id="tab-pnl"></section>
    <section class="tab" id="tab-journal"></section>
    <section class="tab" id="tab-alerts"></section>
    <section class="tab" id="tab-algo"></section>
    <section class="tab" id="tab-data"></section>
  </main>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ==========================================================================
   DalalQuant — single-file Indian markets terminal
   Data sources (per symbol, shown as badges): SIM (simulated demo), CSV (imported), LIVE (broker bridge)
   ========================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x));
const r2=x=>Math.round(x*100)/100;
const last=a=>{for(let i=a.length-1;i>=0;i--) if(a[i]!=null) return a[i]; return null};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const std=a=>{if(a.length<2)return null;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1))};
const median=a=>{const b=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y);if(!b.length)return null;const k=b.length>>1;return b.length%2?b[k]:(b[k-1]+b[k])/2};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const SS={get(k,d){try{const v=sessionStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(R){let u=0,v=0;while(u===0)u=R();while(v===0)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function fN(x,d=2){if(x==null||!isFinite(x))return '—';return Number(x).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fCr(x){if(x==null||!isFinite(x))return '—';if(Math.abs(x)>=1e5)return '₹'+fN(x/1e5,2)+' L Cr';return '₹'+fN(x,0)+' Cr'}
function CUR(sym){const s=S.bySym&&S.bySym[sym];return s&&s.mkt==='US'?'$':'₹'}
function fMoney(x,sym){if(x==null||!isFinite(x))return '—';const s=S.bySym&&S.bySym[sym];if(s&&s.mkt==='US')return Math.abs(x)>=1e6?'$'+fN(x/1e6,2)+' T':Math.abs(x)>=1000?'$'+fN(x/1000,1)+' B':'$'+fN(x,0)+' M';return fCr(x)}
function fP(x,d=1){if(x==null||!isFinite(x))return '<span class="mu">—</span>';return `<span class="${x>=0?'up':'dn'}">${x>=0?'+':''}${(x*100).toFixed(d)}%</span>`}
function fPp(x,d=1){if(x==null||!isFinite(x))return '—';return (x*100).toFixed(d)+'%'}
function fPt(x,d=1){if(x==null||!isFinite(x))return '—';return (x>=0?'+':'')+(x*100).toFixed(d)+'%'}
function toast(msg,ms=2600){const t=$('#toast');t.innerHTML=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms)}
function modal(html){$('#modalBox').innerHTML=html+'<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn s" data-act="closeModal">Close</button></div>';$('#modal').style.display='flex'}
function closeModal(){$('#modal').style.display='none'}
function askConfirm(html,onYes){$('#modalBox').innerHTML=html+'<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn s" data-act="closeModal">Cancel</button><button class="btn r" id="cfYes">Confirm</button></div>';$('#modal').style.display='flex';$('#cfYes').onclick=()=>{closeModal();onYes()}}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Copied to clipboard')}catch(e){modal('<div class="h3">Copy manually</div><textarea rows="14" readonly>'+esc(text)+'</textarea>')}}
function download(name,text,type='text/csv'){try{const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Download started — if nothing happened, use Copy')}catch(e){copyText(text)}}

 }
 {const L=Math.log(bars[n-1].c/bars[0].c),lo=Math.log(0.45),hi=Math.log(3.2);const tgt=Math.min(hi,Math.max(lo,L));if(tgt!==L){const adj=tgt-L;bars.forEach((b,i)=>{const f=Math.exp(adj*i/(n-1));b.o=r2(b.o*f);b.h=r2(b.h*f);b.l=r2(b.l*f);b.c=r2(b.c*f)})}}

 const ga=-0.03+R()*0.33;const em=fin?0.30+R()*0.25:0.08+R()*0.27;const nm=em*(0.42+R()*0.25);const fcfr=0.45+R()*0.65;

/* ============================== Indicators ============================== */
function sma(a,n){const o=new Array(a.length).fill(null);let s=0;for(let i=0;i<a.length;i++){s+=a[i];if(i>=n)s-=a[i-n];if(i>=n-1)o[i]=s/n}return o}
function ema(a,n){const o=new Array(a.length).fill(null);const k=2/(n+1);let e=null;for(let i=0;i<a.length;i++){if(a[i]==null)continue;if(e===null){let cnt=0,s=0;for(let j=i;j>=0&&cnt<n;j--){if(a[j]==null)break;s+=a[j];cnt++}if(cnt<n)continue;e=s/n}else e=a[i]*k+e*(1-k);o[i]=e}return o}
function rsiA(c,n=14){const o=new Array(c.length).fill(null);let g=0,l=0;for(let i=1;i<c.length;i++){const d=c[i]-c[i-1];if(i<=n){g+=Math.max(d,0);l+=Math.max(-d,0);if(i===n){g/=n;l/=n;o[i]=l===0?100:100-100/(1+g/l)}}else{g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;o[i]=l===0?100:100-100/(1+g/l)}}return o}
function macdA(c,f=12,s=26,sg=9){const ef=ema(c,f),es=ema(c,s);const m=c.map((_,i)=>ef[i]!=null&&es[i]!=null?ef[i]-es[i]:null);const sig=ema(m,sg);const hist=m.map((x,i)=>x!=null&&sig[i]!=null?x-sig[i]:null);return {m,sig,hist}}
function atrA(b,n=14){const o=new Array(b.length).fill(null);let a=null,s=0;for(let i=0;i<b.length;i++){const tr=i===0?b[i].h-b[i].l:Math.max(b[i].h-b[i].l,Math.abs(b[i].h-b[i-1].c),Math.abs(b[i].l-b[i-1].c));if(i<n){s+=tr;if(i===n-1){a=s/n;o[i]=a}}else{a=(a*(n-1)+tr)/n;o[i]=a}}return o}
function bollA(c,n=20,k=2){const mid=sma(c,n),up=[],lo=[];for(let i=0;i<c.length;i++){if(mid[i]==null){up.push(null);lo.push(null);continue}let s=0;for(let j=i-n+1;j<=i;j++)s+=(c[j]-mid[i])**2;const sd=Math.sqrt(s/n);up.push(mid[i]+k*sd);lo.push(mid[i]-k*sd)}return {mid,up,lo}}
function stA(b,n=10,m=3){const a=atrA(b,n);const line=[],dir=[];let pfu=null,pfl=null,d=1;for(let i=0;i<b.length;i++){if(a[i]==null||i===0){line.push(null);dir.push(null);continue}const hl=(b[i].h+b[i].l)/2,bu=hl+m*a[i],bl=hl-m*a[i];const fu=(pfu==null||bu<pfu||b[i-1].c>pfu)?bu:pfu;const fl=(pfl==null||bl>pfl||b[i-1].c<pfl)?bl:pfl;if(d===1&&b[i].c<fl)d=-1;else if(d===-1&&b[i].c>fu)d=1;pfu=fu;pfl=fl;dir.push(d);line.push(d===1?fl:fu)}return {line,dir}}
function donA(b,n){const hi=[],lo=[];for(let i=0;i<b.length;i++){if(i<n-1){hi.push(null);lo.push(null);continue}let h=-Infinity,l=Infinity;for(let j=i-n+1;j<=i;j++){h=Math.max(h,b[j].h);l=Math.min(l,b[j].l)}hi.push(h);lo.push(l)}return {hi,lo}}

function tokenize(src){const s=src.toLowerCase();const T=[];let i=0;while(i<s.length){const ch=s[i];if(/\s/.test(ch)){i++;continue}
 if(/[0-9.]/.test(ch)){let j=i;while(j<s.length&&/[0-9._]/.test(s[j]))j++;T.push({t:'n',v:parseFloat(s.slice(i,j).replace(/_/g,''))});i=j;continue}
 const two=s.slice(i,i+2);if(['>=','<=','!=','==','<>'].includes(two)){T.push({t:'op',v:two==='<>'?'!=':two});i+=2;continue}
 if('<>='.includes(ch)){T.push({t:'op',v:ch==='='?'==':ch});i++;continue}
 if('+-*/'.includes(ch)&&!(ch==='/'&&false)){ // field names may contain '/', try fields first
  const fm=FNAMES.find(([n])=>s.startsWith(n,i)&&!/[a-z0-9]/.test(s[i+n.length]||' '));if(fm&&ch!=='-'&&ch!=='+'&&ch!=='*'){T.push({t:'f',v:fm[1]});i+=fm[0].length;continue}
  T.push({t:'ar',v:ch});i++;continue}
 if(ch==='('||ch===')'){T.push({t:ch});i++;continue}
 const kw=s.slice(i).match(/^(and|or|not)\b/);if(kw){T.push({t:kw[1]});i+=kw[1].length;continue}
 const fm=FNAMES.find(([n])=>s.startsWith(n,i)&&!/[a-z0-9]/.test(s[i+n.length]||' '));if(fm){T.push({t:'f',v:fm[1]});i+=fm[0].length;continue}
 const word=s.slice(i).match(/^[a-z0-9/ ]{1,30}/);throw new Error('Unknown field near "'+(word?word[0].trim():ch)+'"')}
 return T}
function parseQuery(src){const T=tokenize(src);let p=0;const peek=()=>T[p],eat=t=>{if(!T[p]||T[p].t!==t)throw new Error('Expected '+t);return T[p++]};
 const prim=()=>{const k=peek();if(!k)throw new Error('Unexpected end');if(k.t==='n'){p++;return ()=>k.v}if(k.t==='f'){p++;const g=FIELDS[k.v][2];return m=>{const v=g(m);return v==null||!isFinite(v)?null:v}}if(k.t==='('){p++;const e=orE();eat(')');return e}if(k.t==='ar'&&k.v==='-'){p++;const e=prim();return m=>{const v=e(m);return v==null?null:-v}}throw new Error('Unexpected token')};
 const prod=()=>{let a=prim();while(peek()&&peek().t==='ar'&&(peek().v==='*'||peek().v==='/')){const op=T[p++].v,b=prim(),A=a;a=m=>{const x=A(m),y=b(m);if(x==null||y==null)return null;return op==='*'?x*y:(y===0?null:x/y)}}return a};
 const sum=()=>{let a=prod();while(peek()&&peek().t==='ar'&&(peek().v==='+'||peek().v==='-')){const op=T[p++].v,b=prod(),A=a;a=m=>{const x=A(m),y=b(m);if(x==null||y==null)return null;return op==='+'?x+y:x-y}}return a};
 const cmp=()=>{const a=sum();if(peek()&&peek().t==='op'){const op=T[p++].v,b=sum();return m=>{const x=a(m),y=b(m);if(x==null||y==null)return false;switch(op){case '>':return x>y;case '<':return x<y;case '>=':return x>=y;case '<=':return x<=y;case '==':return Math.abs(x-y)<1e-9;case '!=':return x!==y}}}return m=>!!a(m)};
 const notE=()=>{if(peek()&&peek().t==='not'){p++;const e=notE();return m=>!e(m)}return cmp()};
 const andE=()=>{let a=notE();while(peek()&&peek().t==='and'){p++;const b=notE(),A=a;a=m=>A(m)&&b(m)}return a};
 const orE=()=>{let a=andE();while(peek()&&peek().t==='or'){p++;const b=andE(),A=a;a=m=>A(m)||b(m)}return a};
 const e=orE();if(p<T.length)throw new Error('Unexpected input after position '+p);return e}

function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y}
const Ncdf=x=>0.5*(1+erf(x/Math.SQRT2)),npdf=x=>Math.exp(-x*x/2)/Math.sqrt(2*Math.PI);
function bs(S0,K,T,r,v,type){if(T<=0){const iv=type==='CE'?Math.max(0,S0-K):Math.max(0,K-S0);return {price:iv,delta:type==='CE'?(S0>K?1:0):(S0<K?-1:0),gamma:0,theta:0,vega:0,rho:0}}
 const d1=(Math.log(S0/K)+(r+v*v/2)*T)/(v*Math.sqrt(T)),d2=d1-v*Math.sqrt(T);const disc=Math.exp(-r*T);
 if(type==='CE')return {price:S0*Ncdf(d1)-K*disc*Ncdf(d2),delta:Ncdf(d1),gamma:npdf(d1)/(S0*v*Math.sqrt(T)),theta:(-S0*npdf(d1)*v/(2*Math.sqrt(T))-r*K*disc*Ncdf(d2))/365,vega:S0*npdf(d1)*Math.sqrt(T)/100,rho:K*T*disc*Ncdf(d2)/100};
 return {price:K*disc*Ncdf(-d2)-S0*Ncdf(-d1),delta:Ncdf(d1)-1,gamma:npdf(d1)/(S0*v*Math.sqrt(T)),theta:(-S0*npdf(d1)*v/(2*Math.sqrt(T))+r*K*disc*Ncdf(-d2))/365,vega:S0*npdf(d1)*Math.sqrt(T)/100,rho:-K*T*disc*Ncdf(-d2)/100}}
function impliedVol(px,S0,K,T,r,type){let lo=0.01,hi=3;for(let i=0;i<80;i++){const mid=(lo+hi)/2;if(bs(S0,K,T,r,mid,type).price>px)hi=mid;else lo=mid}return (lo+hi)/2}

function opStep(spot){const u=S.op.und;if(S.op.step)return S.op.step;if(u==='NIFTY BANK'||u==='SENSEX')return 100;if(S.IDX[u])return 50;const raw=spot*0.01;const p=Math.pow(10,Math.floor(Math.log10(raw)));return [1,2,2.5,5,10].map(x=>x*p).find(x=>x>=raw)||raw}
function opLot(){const u=S.op.und;return S.op.lot||S.cfg.lots[u]||(S.IDX[u]?50:Math.max(1,Math.round(500000/Math.max(1,opSpot())/25)*25)||1)}
function buildChain(){const O=S.op,spot=opSpot(),step=opStep(spot),T=O.dte/365,r=O.r/100;const atm=Math.round(spot/step)*step;const R=rng(hash(O.und+O.dte));const rows=[];
 for(let k=-15;k<=15;k++){const K=atm+k*step;if(K<=0)continue;const mny=Math.log(K/spot);const skew=O.iv/100*(1+0.9*mny*mny*25-0.6*mny);const iv=Math.max(0.05,skew);
  const ce=bs(spot,K,T,r,iv,'CE'),pe=bs(spot,K,T,r,iv,'PE');const base=Math.exp(-Math.abs(k)/6)*1e6;
  const ceOI=Math.round(base*(k>=0?1.3:0.5)*(0.6+R()*0.8)),peOI=Math.round(base*(k<=0?1.3:0.5)*(0.6+R()*0.8));
  rows.push({K,ce:{ltp:ce.price,iv:iv*100,oi:ceOI,chgoi:Math.round(ceOI*(R()-0.4)*0.3),delta:ce.delta,theta:ce.theta,vega:ce.vega,gamma:ce.gamma},pe:{ltp:pe.price,iv:iv*100,oi:peOI,chgoi:Math.round(peOI*(R()-0.4)*0.3),delta:pe.delta,theta:pe.theta,vega:pe.vega,gamma:pe.gamma}})}
 return {spot,step,atm,rows,sim:true}}
function maxPain(rows){let best=null,bv=Infinity;rows.forEach(r=>{let v=0;rows.forEach(x=>{v+=x.ce.oi*Math.max(0,r.K-x.K)+x.pe.oi*Math.max(0,x.K-r.K)});if(v<bv){bv=v;best=r.K}});return best}

function payoff(){const O=S.op,lot=opLot(),spot=O.chain.spot;const far=Math.max(...O.legs.map(L=>Math.abs(L.K-spot)),0);const span=Math.max(spot*O.iv/100*Math.sqrt(Math.max(O.dte,1)/365)*3.5,spot*0.025,far*1.6);const lo=Math.max(0.01,spot-span),hi=spot+span,N=241;const xs=Array.from({length:N},(_,i)=>lo+(hi-lo)*i/(N-1));const iv=O.iv/100,r=O.r/100;
 const pnl=(ST,T)=>O.legs.reduce((a,L)=>a+(L.side==='B'?1:-1)*(legValue(L,ST,T,iv,r)-L.prem)*lot*L.lots,0);
 const ex=xs.map(x=>pnl(x,0)),now=xs.map(x=>pnl(x,O.dte/365));const be=[];for(let i=1;i<N;i++){if((ex[i-1]<0)!==(ex[i]<0)){const t=ex[i-1]/(ex[i-1]-ex[i]);be.push(xs[i-1]+t*(xs[i]-xs[i-1]))}}
 const slopeHi=ex[N-1]-ex[N-2],slopeLo=ex[1]-ex[0];
 const g={delta:0,gamma:0,theta:0,vega:0};O.legs.forEach(L=>{const sg=(L.side==='B'?1:-1)*lot*L.lots;if(L.type==='FUT'){g.delta+=sg;return}const b=bs(spot,L.K,O.dte/365,r,iv,L.type);g.delta+=sg*b.delta;g.gamma+=sg*b.gamma;g.theta+=sg*b.theta;g.vega+=sg*b.vega});
 const net=O.legs.reduce((a,L)=>a+(L.side==='B'?-1:1)*(L.type==='FUT'?0:L.prem)*lot*L.lots,0);
 const shortOpt=O.legs.filter(L=>L.side==='S'&&L.type!=='FUT').reduce((a,L)=>a+L.K*lot*L.lots,0);
 return {xs,ex,now,be,maxP:slopeHi>1e-6?Infinity:Math.max(...ex),maxL:(slopeLo>1e-6||slopeHi<-1e-6)?-Infinity:Math.min(...ex),g,net,marginEst:shortOpt*0.12+O.legs.filter(L=>L.type==='FUT').length*spot*lot*0.12}}

S.algo=Object.assign({name:'Trend + pullback',universe:'NIFTY 50',conds:[{l:'close',lp:0,op:'>',rt:'ind',rk:'sma',rp:200,r:0},{l:'rsi',lp:14,op:'crosses above',rt:'num',r:40,rk:'sma',rp:50},{l:'score',lp:0,op:'>',rt:'num',r:55,rk:'sma',rp:50}],side:'BUY',sizing:'amt',amt:50000,qty:1,product:'CNC',sl:5,tp:12,auto:false,every:60,risk:{maxOrders:10,maxLoss:20000,maxTrade:100000,kill:false},live:false,signals:[],log:[]},LS.get('dq_algo',{}),{auto:false,live:false});

function indSeries(sym,key,p){const d=S.D[sym],m=S.M[sym];const b=d.bars,c=b.map(x=>x.c);switch(key){case 'close':return c;case 'open':return b.map(x=>x.o);case 'high':return b.map(x=>x.h);case 'low':return b.map(x=>x.l);case 'volume':return b.map(x=>x.v);case 'sma':return sma(c,p||20);case 'ema':return ema(c,p||20);case 'rsi':return rsiA(c,p||14);case 'macdh':return macdA(c).hist;case 'atr':return atrA(b,p||14);case 'chgp':return c.map((x,i)=>i?(x/c[i-1]-1)*100:null);case 'offh':return c.map((x,i)=>{const s=Math.max(0,i-251);let h=-Infinity;for(let j=s;j<=i;j++)h=Math.max(h,b[j].h);return (x/h-1)*100});case 'score':return [m.score,m.score];case 'stdir':return stA(b).dir}return []}
function evalCond(sym,C){const L=indSeries(sym,C.l,C.lp);const R=C.rt==='num'?null:indSeries(sym,C.rk,C.rp);const l1=L[L.length-1],l0=L[L.length-2];const r1=R?R[R.length-1]:+C.r,r0=R?R[R.length-2]:+C.r;if(l1==null||r1==null)return false;
 switch(C.op){case '>':return l1>r1;case '<':return l1<r1;case '>=':return l1>=r1;case '<=':return l1<=r1;case 'crosses above':return l0!=null&&r0!=null&&l0<=r0&&l1>r1;case 'crosses below':return l0!=null&&r0!=null&&l0>=r0&&l1<r1}return false}
function alog(msg){S.algo.log.unshift(`${new Date().toLocaleTimeString('en-IN')}  ${msg}`);S.algo.log=S.algo.log.slice(0,200)}
function todayOrders(){const d=new Date().toDateString();return S.paper.orders.filter(o=>new Date(o.time).toDateString()===d)}
function paperDayPnL(){let r=0;const d=new Date().toDateString();S.paper.orders.forEach(o=>{if(o.status==='FILLED'&&o.realized!=null&&new Date(o.time).toDateString()===d)r+=o.realized});let u=0;for(const k in S.paper.pos){const p=S.paper.pos[k],m=S.M[k];if(m&&p.qty)u+=(m.price-p.avg)*p.qty}return r+u}
async function placeOrder(o){const A=S.algo,R=A.risk;o.id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);o.time=Date.now();o.mode=A.live&&S.bridge.ok?'LIVE':'PAPER';
 const m=S.M[o.sym];const px=o.type==='LIMIT'?+o.price:(m?m.price:0);const val=px*o.qty;
 const rej=why=>{o.status='REJECTED';o.note=why;S.paper.orders.unshift(o);savePaper();alog(`✗ ${o.side} ${o.qty} ${o.sym} rejected: ${why}`);return o};
 if(R.kill)return rej('kill switch ON');if(todayOrders().length>=R.maxOrders)return rej('max orders/day reached');if(val>R.maxTrade)return rej(`order value ₹${fN(val,0)} > max per trade`);if(-paperDayPnL()>=R.maxLoss)return rej('daily loss limit hit');if(!(o.qty>0))return rej('qty must be > 0');
 if(o.mode==='LIVE'){try{const res=await bridgeFetch('/order',{method:'POST',body:JSON.stringify({symbol:o.sym,exchange:'NSE',side:o.side,qty:o.qty,type:o.type,price:o.type==='LIMIT'?+o.price:0,product:o.product,tag:o.strategy||'DQ'})});o.status=res.status||'SENT';o.brokerId=res.order_id;o.note=res.message||'';alog(`→ LIVE ${o.side} ${o.qty} ${o.sym} · ${o.status} ${o.brokerId||''}`)}catch(e){o.status='ERROR';o.note=e.message;alog(`✗ LIVE order error: ${e.message}`)}S.paper.orders.unshift(o);savePaper();return o}
 const pos=S.paper.pos[o.sym]||{qty:0,avg:0};if(o.side==='SELL'&&o.product==='CNC'&&pos.qty<o.qty)return rej('CNC sell exceeds holdings (use MIS for intraday short)');
 if(o.type==='LIMIT'&&((o.side==='BUY'&&m.price>+o.price)||(o.side==='SELL'&&m.price<+o.price))){o.status='OPEN';S.paper.orders.unshift(o);savePaper();alog(`◷ LIMIT ${o.side} ${o.qty} ${o.sym} @ ${o.price} open`);return o}
 fillPaper(o,o.type==='LIMIT'?+o.price:m.price);S.paper.orders.unshift(o);savePaper();return o}
function fillPaper(o,px){const pos=S.paper.pos[o.sym]||{qty:0,avg:0};const sg=o.side==='BUY'?1:-1;const cost=txnCost(px*o.qty,o.side==='BUY'?'B':'S',o.product==='MIS'?'I':'D');let realized=0;
 if(pos.qty===0||Math.sign(pos.qty)===sg){pos.avg=(pos.avg*Math.abs(pos.qty)+px*o.qty)/(Math.abs(pos.qty)+o.qty);pos.qty+=sg*o.qty}else{const close=Math.min(Math.abs(pos.qty),o.qty);realized=(px-pos.avg)*close*Math.sign(pos.qty);pos.qty+=sg*o.qty;if(Math.abs(o.qty)>close)pos.avg=px;if(pos.qty===0)pos.avg=0}
 realized-=cost;o.status='FILLED';o.fill=px;o.realized=realized;o.cost=cost;S.paper.cash-=sg*px*o.qty+cost;
 if(o.sl||o.tp){pos.sl=o.sl?px*(1-sg*o.sl/100):null;pos.tp=o.tp?px*(1+sg*o.tp/100):null;pos.strategy=o.strategy}
 if(pos.qty===0){delete S.paper.pos[o.sym]}else S.paper.pos[o.sym]=pos;alog(`✓ PAPER ${o.side} ${o.qty} ${o.sym} @ ${fN(px)} (charges ₹${fN(cost,2)})`)}

 for(const k in S.paper.pos){const p=S.paper.pos[k],m=S.M[k];if(!m)continue;const long=p.qty>0;if(p.sl&&((long&&m.price<=p.sl)||(!long&&m.price>=p.sl))){alog(`⛔ SL hit ${k} @ ${fN(m.price)}`);placeOrder({sym:k,side:long?'SELL':'BUY',qty:Math.abs(p.qty),type:'MARKET',product:S.algo.product,strategy:'SL'})}else if(p.tp&&((long&&m.price>=p.tp)||(!long&&m.price<=p.tp))){alog(`🎯 Target hit ${k} @ ${fN(m.price)}`);placeOrder({sym:k,side:long?'SELL':'BUY',qty:Math.abs(p.qty),type:'MARKET',product:S.algo.product,strategy:'TP'})}}savePaper()}

/* ============================== DATA & SETTINGS ============================== */
function parseCSV(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else{if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
function normDate(s){s=String(s).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;m=s.match(/^(\d{1,2})[-/ ]([A-Za-z]{3}|\d{1,2})[-/ ](\d{2,4})/);if(m){const mon=isNaN(+m[2])?['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[2].toLowerCase())+1:+m[2];const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${String(mon).padStart(2,'0')}-${m[1].padStart(2,'0')}`}const d=new Date(s);return isNaN(d)?null:d.toISOString().slice(0,10)}
function importPrices(name,text){const rows=parseCSV(text);if(rows.length<2)return 'empty';const h=rows[0].map(x=>x.trim().toLowerCase());const ix=k=>h.findIndex(x=>x===k||x.startsWith(k));const iD=ix('date'),iO=ix('open'),iH=ix('high'),iL=ix('low'),iC=h.findIndex(x=>x==='close'||x==='close price'||x==='ltp'||x==='adj close'||x.startsWith('close')),iV=h.findIndex(x=>x.startsWith('vol')||x.includes('traded qty')),iS=h.findIndex(x=>x==='symbol'||x==='ticker');
 if(iD<0||iC<0)return 'needs Date and Close columns';const by={};const fsym=name.replace(/\.(csv|txt)$/i,'').replace(/\.(NS|BO)$/i,'').toUpperCase();
 rows.slice(1).forEach(r=>{const sym=(iS>=0?r[iS]:fsym).trim().toUpperCase().replace(/\.(NS|BO)$/,'');const t=normDate(r[iD]);const n=x=>+String(x).replace(/,/g,'');const c=n(r[iC]);if(!t||!isFinite(c))return;(by[sym]=by[sym]||[]).push({t,o:iO>=0?n(r[iO]):c,h:iH>=0?n(r[iH]):c,l:iL>=0?n(r[iL]):c,c,v:iV>=0?n(r[iV])||0:0})});
 let cnt=0;for(const [sym,b] of Object.entries(by)){b.sort((a,b)=>a.t<b.t?-1:1);if(!S.bySym[sym]){addSymbol({sym,name:sym,sector:'Other',codes:''})}const d=S.D[sym];d.bars=b;d.src.px='csv';cnt++}mergeDates();return `${cnt} symbol(s) loaded`}
function importFund(text){const rows=parseCSV(text);const h=rows[0].map(x=>x.trim().toLowerCase());const g=(r,k)=>{const i=h.indexOf(k);return i<0?'':r[i]};const by={};
 rows.slice(1).forEach(r=>{const sym=g(r,'symbol').trim().toUpperCase();if(!sym)return;(by[sym]=by[sym]||{q:[],meta:{}});const o=by[sym];o.q.push({p:g(r,'period'),rev:+g(r,'revenue'),ebitda:g(r,'ebitda')===''?null:+g(r,'ebitda'),np:+g(r,'netprofit'),fcf:g(r,'fcf')===''?null:+g(r,'fcf'),eps:g(r,'eps')===''?null:+g(r,'eps')});['shares','debt','cash','equity','promoter','fii','dii'].forEach(k=>{const v=g(r,k);if(v!=='')o.meta[k]=+v})});
 let cnt=0;for(const [sym,o] of Object.entries(by)){if(!S.bySym[sym])addSymbol({sym,name:sym,sector:'Other',codes:''});o.q.forEach(x=>{x.fy=fyFromLabel(x.p);const mq=String(x.p).match(/Q([1-4])/i);x.qn=mq?+mq[1]:0});o.q.sort((a,b)=>a.fy-b.fy||a.qn-b.qn);applyFund(sym,Object.assign({q:o.q,source:'csv'},o.meta));if(o.meta.dy!=null)S.D[sym].dy=o.meta.dy;cnt++}return `${cnt} company(ies) loaded`}
function addSymbol(s){s.mkt=/[UQ]/.test(s.codes||'')?'US':'IN';S.uni.push(s);s.idx=INDEX_DEFS.filter(d=>d.f(s)).map(d=>d.id);S.bySym[s.sym]=s;S.D[s.sym]=genSim(s);fillDatalist()}
function mergeDates(){const set=new Set(S.dates);Object.values(S.D).forEach(d=>d.bars.forEach(b=>set.add(b.t)));S.dates=[...set].sort().slice(-1200)}

 <b>DQ Score</b> = weighted average of Trend (price vs 50/200-DMA), Momentum (RSI 14, MACD), Valuation (upside to median intrinsic value + P/E vs sector median), Quality (ROE, debt/equity, net margin; lenders on ROE), Growth (3-year sales &amp; profit CAGR, latest-quarter YoY) and Risk (volatility, 1-year drawdown). <b>Signal</b>: BUY ZONE if score ≥ 68 and trend ≥ 70; HOLD ≥ 55; WAIT ≥ 42; otherwise EXIT. A hard EXIT fires when price &lt; 200-DMA, 50-DMA &lt; 200-DMA and Supertrend is bearish.

function resultsWindow(){// next expected results window from Indian FY quarter calendar (estimate)
 const now=new Date();const ends=[[5,30],[8,30],[11,31],[2,31]];// Jun30, Sep30, Dec31, Mar31 (month index)
 const cands=[];for(let y=now.getFullYear()-1;y<=now.getFullYear()+1;y++)ends.forEach(([m,d])=>{const e=new Date(y,m,d);const by=new Date(e.getTime()+(m===2?60:45)*86400000);cands.push({e,by})});
 const nx=cands.filter(c=>c.by>now).sort((a,b)=>a.by-b.by)[0];const {q,fy}=fyq(nx.e);return {label:`Q${q} FY${String(fy).slice(2)}`,qend:nx.e,by:nx.by}}
function projections(m){if(!m.hasF||!(m.epsTTM>0))return null;const base=clamp(((m.rev3y??m.rev1y??0.08)*0.6+(m.np3y??m.np1y??0.08)*0.4),-0.1,0.3);const pe=(S.SEC[S.bySym[m.sym].sector]||{}).medPE||m.pe||15;
 const sc=[['Bear',base-0.06,pe*0.8],['Base',base,pe],['Bull',base+0.05,pe*1.15]].map(([n,g,xpe])=>{const eps3=m.epsTTM*Math.pow(1+g,3);const px=eps3*xpe;return {n,g,xpe,eps3,px,cagr:Math.pow(Math.max(px,0.01)/m.price,1/3)-1}});return {base,sc}}
function driversRisks(m,s){const D=[],R=[];const P=(c,t,arr)=>{if(c)arr.push(t)};
 P(m.rev3y>0.15,`Fast top-line growth: sales compounding ${fPp(m.rev3y)} a year over 3 years`,D);P(m.np3y>m.rev3y&&m.np3y>0.1,`Operating leverage: profit growing faster (${fPp(m.np3y)}) than sales`,D);
 P(m.ebitdaMprev!=null&&m.ebitdaM>m.ebitdaMprev+0.01,`Margins expanding (OPM ${fPp(m.ebitdaM)} vs ${fPp(m.ebitdaMprev)} a year ago)`,D);P(m.roe>0.18,`High return on equity (${fPp(m.roe)})`,D);
 P(!m.fin&&m.de!=null&&m.de<0.3,`Strong balance sheet (debt/equity ${fN(m.de)})`,D);P(m.mshare>0.15,`Sector leader: ~${fPp(m.mshare,0)} of tracked sector sales`,D);P(m.ups>0.15,`Trades ${fPp(m.ups,0)} below median intrinsic value`,D);
 P(m.sma200&&m.price>m.sma200&&m.sma50>m.sma200,'Primary uptrend intact (above 200-DMA, golden-cross regime)',D);P(m.fscore>=7,`Financial-strength F-score ${m.fscore}/8`,D);
 P(m.rev3y!=null&&m.rev3y<0.05,`Slow growth: 3-year sales CAGR only ${fPp(m.rev3y)}`,R);P(m.ebitdaMprev!=null&&m.ebitdaM<m.ebitdaMprev-0.01,`Margins contracting (OPM ${fPp(m.ebitdaM)} vs ${fPp(m.ebitdaMprev)})`,R);
 P(!m.fin&&m.de>1,`High leverage (debt/equity ${fN(m.de)})`,R);P(m.pe>60,`Rich valuation (P/E ${fN(m.pe,0)}) leaves little room for disappointment`,R);P(m.ups!=null&&m.ups<-0.2,`Price ${fPp(-m.ups,0)} above median intrinsic value`,R);
 P(m.sma200&&m.price<m.sma200,'Below the 200-DMA: the long-term trend is down',R);P(m.vol>0.4,`High volatility (${fPp(m.vol,0)} annualised)`,R);P(m.npYoY!=null&&m.npYoY<-0.1,`Latest quarter profit fell ${fPp(-m.npYoY,0)} YoY`,R);
 const d=S.D[m.sym];if(d.sh&&d.sh.length>2){const a=d.sh[0].prom,b=d.sh[d.sh.length-1].prom;P(b<a-1.5,`Promoter holding down from ${fN(a,1)}% to ${fN(b,1)}%`,R);P(b>a+1,`Promoter holding up from ${fN(a,1)}% to ${fN(b,1)}%`,D)}
 const sec=s.sector;const G=globalCues();G.cues.filter(c=>c.sec.includes(sec)).forEach(c=>(c.dir>0?D:R).push('Global cue: '+c.txt));
 return {D,R}}
function callFor(m){const c=S.cfg,b=S.D[m.sym].bars;const low20=Math.min(...b.slice(-20).map(x=>x.l)),hi20=Math.max(...b.slice(-20).map(x=>x.h));
 const stop=Math.max(0.01,Math.min(m.price-c.atrK*m.atr,low20*0.99));const r=m.price-stop;
 const inv=m.verdict==='BUY ZONE'||(m.opp&&!m.hardExit)?'ACCUMULATE':m.verdict==='HOLD'?'HOLD':m.verdict==='WAIT'?'WAIT FOR SETUP':'EXIT / AVOID';
 const ezLo=m.sma50&&m.sma50<m.price?Math.max(m.sma50,stop+r*0.3):m.price-r*0.5,ezHi=m.price;
 const conv=m.score>=75?'High':m.score>=60?'Medium':'Low';
 return {inv,trader:m.verdict,ezLo,ezHi,stop,t1:m.price+r*1.5,t2:m.price+r*c.rr*1.5,t3:m.iv&&m.iv.avg>m.price?m.iv.avg:null,low20,hi20,conv,exitIf:[`Daily close below ${fN(stop)} (stop)`,m.sma200?`Close below 200-DMA ${fN(m.sma200)} with 50-DMA below 200-DMA`:null,`Supertrend turns bearish (now ${m.stDir===1?'bullish':'bearish'}, line ${fN(m.stLine)})`,m.iv&&m.iv.avg?(m.price>m.iv.avg*1.25?`Already ${fPp(m.price/m.iv.avg-1,0)} above fair value (~${fN(m.iv.avg)}) — consider booking partial profits`:`Price rises above ~${fN(m.iv.avg*1.25)} (25% over fair value) — consider booking profits`):null].filter(Boolean)}}

/* ============================== QUANT LAB — numerical machinery ============================== */
// ---------- linear algebra & statistics ----------
function matInv(A){const n=A.length;const M=A.map((r,i)=>[...r,...Array.from({length:n},(_,j)=>i===j?1:0)]);for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;if(Math.abs(M[p][c])<1e-12)return null;[M[c],M[p]]=[M[p],M[c]];const d=M[c][c];for(let j=0;j<2*n;j++)M[c][j]/=d;for(let r=0;r<n;r++){if(r===c)continue;const f=M[r][c];if(f)for(let j=0;j<2*n;j++)M[r][j]-=f*M[c][j]}}return M.map(r=>r.slice(n))}
function ols(X,y){const k=X[0].length,n=X.length;const XtX=Array.from({length:k},()=>new Array(k).fill(0)),Xty=new Array(k).fill(0);for(let i=0;i<n;i++){for(let a=0;a<k;a++){Xty[a]+=X[i][a]*y[i];for(let b=0;b<k;b++)XtX[a][b]+=X[i][a]*X[i][b]}}const inv=matInv(XtX);if(!inv)return null;const b=inv.map(r=>r.reduce((s,v,j)=>s+v*Xty[j],0));const res=y.map((v,i)=>v-X[i].reduce((s,x,j)=>s+x*b[j],0));const sse=res.reduce((s,v)=>s+v*v,0);const s2=sse/Math.max(1,n-k);const my=mean(y);const sst=y.reduce((s,v)=>s+(v-my)**2,0);return {b,se:inv.map((r,i)=>Math.sqrt(Math.max(0,r[i]*s2))),res,r2:sst>0?1-sse/sst:0,s2}}
function moments(a){const n=a.length,m=mean(a),sd=std(a);let s3=0,s4=0;a.forEach(x=>{const z=(x-m)/sd;s3+=z**3;s4+=z**4});const sk=s3/n,ku=s4/n;const jb=n/6*(sk*sk+(ku-3)**2/4);return {n,m,sd,sk,ku,jb,jbp:Math.exp(-jb/2)}}
function acf(a,L=20){const m=mean(a);const d=a.reduce((s,x)=>s+(x-m)**2,0);return Array.from({length:L},(_,k)=>{let s=0;for(let i=k+1;i<a.length;i++)s+=(a[i]-m)*(a[i-k-1]-m);return s/d})}
function adf(y,lags=1){const dy=y.slice(1).map((v,i)=>v-y[i]);const X=[],Y=[];for(let t=lags;t<dy.length;t++){const row=[1,y[t]];for(let l=1;l<=lags;l++)row.push(dy[t-l]);X.push(row);Y.push(dy[t])}const r=ols(X,Y);if(!r)return null;const t=r.b[1]/r.se[1];return {t,stationary1:t<-3.43,stationary5:t<-2.86,stationary10:t<-2.57,phi:r.b[1]}}
function hurst(r){const ns=[8,16,32,64,128].filter(n=>n*2<=r.length);const xs=[],ys=[];ns.forEach(n=>{const rs=[];for(let s=0;s+n<=r.length;s+=n){const c=r.slice(s,s+n),m=mean(c);let cum=0,mx=-Infinity,mn=Infinity;c.forEach(v=>{cum+=v-m;mx=Math.max(mx,cum);mn=Math.min(mn,cum)});const sd=std(c);if(sd>0)rs.push((mx-mn)/sd)}if(rs.length){xs.push(Math.log(n));ys.push(Math.log(mean(rs)))}});const o=ols(xs.map(x=>[1,x]),ys);return o?o.b[1]:null}
function garch(r){const m=mean(r),e=r.map(x=>x-m),v=std(e)**2;let best=null;for(let a=0.02;a<=0.25;a+=0.01)for(let b=0.6;b<=0.98;b+=0.01){if(a+b>=0.999)continue;const w=v*(1-a-b);let h=v,ll=0;for(let i=0;i<e.length;i++){ll+=-0.5*(Math.log(h)+e[i]*e[i]/h);h=w+a*e[i]*e[i]+b*h}if(!best||ll>best.ll)best={a,b,w,ll,hNext:h}}const fc=k=>v+Math.pow(best.a+best.b,k-1)*(best.hNext-v);return Object.assign(best,{v,fc,half:Math.log(0.5)/Math.log(best.a+best.b)})}

function retMatrix(syms,look){const ms=syms.filter(x=>S.D[x]&&S.D[x].bars.length>look+1);const L=look;const R=ms.map(x=>{const c=S.D[x].bars.slice(-L-1).map(b=>b.c);return c.slice(1).map((v,i)=>Math.log(v/c[i]))});return {syms:ms,R}}

function pairTest(a,b,look=504){const A=S.D[a].bars,B=S.D[b].bars;const mb=new Map(B.map(x=>[x.t,x.c]));const xs=[],ys=[],ts=[];A.slice(-look).forEach(x=>{const v=mb.get(x.t);if(v){ys.push(Math.log(x.c));xs.push(Math.log(v));ts.push(x.t)}});if(ys.length<120)return null;const o=ols(xs.map(x=>[1,x]),ys);const spr=ys.map((y,i)=>y-o.b[0]-o.b[1]*xs[i]);const ad=adf(spr,1);

 logit:{n:'Logistic regression (ML classifier)',cat:'Machine learning',f:(X,H)=>{const T=trainRows(X,H);if(!T)return null;const w=logit(T.rows.map(r=>[1,...r.z]),T.rows.map(r=>r.y>0?1:0),300);const p=sigm([1,...T.zl].reduce((s,v,j)=>s+v*w[j],0));return {exp:(p-0.5)*2*X.sd*Math.sqrt(H),pUp:p,w:w.slice(1)}}},
 olsml:{n:'Linear regression on 9 features',cat:'Machine learning',f:(X,H)=>{const T=trainRows(X,H);if(!T)return null;const o=ols(T.rows.map(r=>[1,...r.z]),T.rows.map(r=>r.y));if(!o)return null;const e=[1,...T.zl].reduce((s,v,j)=>s+v*o.b[j],0);return {exp:e,pUp:Ncdf(e/Math.sqrt(o.s2)),info:`in-sample R² ${fN(o.r2,3)}`}}},
 trees:{n:'Random forest (bagged trees)',cat:'Machine learning',f:(X,H)=>{const T=trainRows(X,H);if(!T)return null;const R=rng(hash('rf'+X.n+H));const preds=[];for(let b=0;b<10;b++){const samp=Array.from({length:T.rows.length},()=>T.rows[Math.floor(R()*T.rows.length)]);preds.push(treePred(treeFit(samp,3,R),T.zl))}const e=mean(preds);return {exp:e,pUp:preds.filter(x=>x>0).length/preds.length*0.6+Ncdf(e/(X.sd*Math.sqrt(H)))*0.4,info:`10 trees, depth 3 · tree agreement ${fPp(preds.filter(x=>Math.sign(x)===Math.sign(e)).length/10,0)}`}}},
 mlp:{n:'Neural network (MLP 9-8-1)',cat:'Machine learning',f:(X,H)=>{const T=trainRows(X,H);if(!T)return null;const R=rng(hash('nn'+X.n+H)),k=T.k,hN=8;const sc=X.sd*Math.sqrt(H)||1;let W1=Array.from({length:hN},()=>Array.from({length:k+1},()=>(R()-0.5)*0.4)),W2=Array.from({length:hN+1},()=>(R()-0.5)*0.4);const fwd=z=>{const h=W1.map(w=>Math.tanh(w[0]+z.reduce((s,v,j)=>s+v*w[j+1],0)));return {h,o:W2[0]+h.reduce((s,v,j)=>s+v*W2[j+1],0)}};
  for(let ep=0;ep<25;ep++)for(const row of T.rows){const {h,o}=fwd(row.z);const err=o-clamp(row.y/sc,-3,3),lr=0.01;for(let j=0;j<hN;j++){const gh=err*W2[j+1]*(1-h[j]*h[j]);W2[j+1]-=lr*(err*h[j]+1e-3*W2[j+1]);W1[j][0]-=lr*gh;for(let q=0;q<k;q++)W1[j][q+1]-=lr*(gh*row.z[q]+1e-3*W1[j][q+1])}W2[0]-=lr*err}
  const o=fwd(T.zl).o*sc;return {exp:o,pUp:Ncdf(o/sc),info:'25 epochs SGD, tanh, L2'}}},
 knn:{n:'k-NN pattern analogs (k=25)',cat:'Machine learning',f:(X,H)=>{const T=trainRows(X,H);if(!T)return null;const d=T.rows.map(r=>({d:Math.sqrt(r.z.reduce((s,v,j)=>s+(v-T.zl[j])**2,0)),y:r.y})).sort((a,b)=>a.d-b.d).slice(0,25);return {exp:mean(d.map(x=>x.y)),pUp:d.filter(x=>x.y>0).length/d.length}}},
 macro:{n:'Factor model (beta × index drift + alpha)',cat:'Statistical',f:(X,H)=>{const s=X.sym&&S.bySym[X.sym];const I=S.IDX[s&&s.mkt==='US'?'S&P 500 (leaders)':'NIFTY 50'];if(!I)return null;const im=new Map(I.bars.map(b=>[b.t,b.c]));const A=[],Y=[],idr=[];for(let i=Math.max(1,X.n-504);i<X.n;i++){const a=im.get(X.bars[i].t),a0=im.get(X.bars[i-1].t);if(a&&a0){const ri=Math.log(a/a0);A.push([1,ri]);Y.push(Math.log(X.c[i]/X.c[i-1]));idr.push(ri)}}if(A.length<60)return null;const o=ols(A,Y);const e=(o.b[0]*0.5+o.b[1]*mean(idr.slice(-252)))*H;return {exp:e,pUp:pFrom(e,X,H),info:`β ${fN(o.b[1],2)}, α ${fPt(o.b[0]*252)}/yr (shrunk 50%)`}}},
};
function runModels(bars,H,sym,keys){const X=fcCtx(bars);X.sym=sym;const out={};for(const k of keys||Object.keys(FC_MODELS)){try{const r=FC_MODELS[k].f(X,H);if(r&&isFinite(r.exp)&&isFinite(r.pUp))out[k]=r}catch(e){}}return out}
function walkForward(bars,H,sym){const n=bars.length,origins=[];for(let o=n-1-H-240;o<=n-1-H;o+=16)if(o>320)origins.push(o);const stat={};for(const k in FC_MODELS)stat[k]={hit:0,tot:0,ae:0,br:0};let naiveAE=0;
 for(const o of origins){const sub=bars.slice(0,o+1);const act=Math.log(bars[o+H].c/bars[o].c);const R=runModels(sub,H,sym);naiveAE+=Math.abs(act);for(const [k,v] of Object.entries(R)){const s=stat[k];s.tot++;if(Math.sign(v.exp||v.pUp-0.5)===Math.sign(act)||((v.pUp>0.5)===(act>0)))s.hit++;s.ae+=Math.abs(act-v.exp);s.br+=(v.pUp-(act>0?1:0))**2}}
 for(const k in stat){const s=stat[k];s.hitRate=s.tot?s.hit/s.tot:null;s.mae=s.tot?s.ae/s.tot:null;s.brier=s.tot?s.br/s.tot:null;s.skill=s.tot&&naiveAE?1-(s.ae/s.tot)/(naiveAE/origins.length):null}return {stat,origins:origins.length}}

 const out=rows.slice(1).map(r=>({symbol:g(r,'symbol','tradingsymbol','scrip','stock_name','instrument'),date:g(r,'trade_date','date','order_execution_time','trade_time','execution_date_and_time'),side:g(r,'trade_type','type','buy/sell','side','transaction_type'),qty:g(r,'quantity','qty','traded_qty'),price:g(r,'price','trade_price','avg_price','rate'),segment:g(r,'segment','exchange_segment','series')}));const T=normTrades(out);S.pnl.trades=T;S.pnl.src='CSV import';savePnl();return `${T.length} trades imported`}
function sampleTrades(){const R=rng(77),syms=S.uni.filter(s=>s.mkt==='IN'&&has(s,'5')).map(s=>s.sym);const out=[];const d0=Date.now()-360*86400000;for(let k=0;k<70;k++){const sym=syms[Math.floor(R()*syms.length)];const b=S.D[sym].bars;const i=b.length-250+Math.floor(R()*200);const j=Math.min(b.length-1,i+3+Math.floor(R()*60));const q=Math.max(1,Math.round(50000/b[i].c));const intr=R()<0.25;out.push({symbol:sym,date:b[i].t,side:'BUY',qty:q,price:b[i].c,segment:intr?'INTRADAY':'EQ'});if(R()<0.8)out.push({symbol:sym,date:intr?b[i].t:b[j].t,side:'SELL',qty:q,price:intr?b[i].c*(1+(R()-0.48)*0.03):b[j].c,segment:intr?'INTRADAY':'EQ'})}S.pnl.trades=normTrades(out);S.pnl.src='SAMPLE (simulated trades)';savePnl()}
function fifo(trades){const Q={},closed=[];const ts=[...trades].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.side==='BUY'?-1:1));
 for(const t of ts){const key=t.sym+'|'+(t.seg.includes('INTRA')||t.product==='MIS'?'INTRADAY':'EQ');const q=Q[key]||(Q[key]=[]);let left=t.qty;
  const sgn=t.side==='BUY'?1:-1;while(left>0&&q.length&&Math.sign(q[0].qty)===-sgn){const lot=q[0];const m=Math.min(left,Math.abs(lot.qty));const entry=lot.price,exit=t.price,long=lot.qty>0;const pnl=(long?exit-entry:entry-exit)*m;
   const intr=key.endsWith('INTRADAY');const ch=txnCost(entry*m,long?'B':'S',intr?'I':'D')+txnCost(exit*m,long?'S':'B',intr?'I':'D');const days=Math.round((new Date(t.date)-new Date(lot.date))/86400000);
   closed.push({sym:t.sym,seg:intr?'Intraday':'Delivery',qty:m,entry,exit,inDate:lot.date,outDate:t.date,pnl,ch,net:pnl-ch,ret:long?exit/entry-1:entry/exit-1,days,long,term:!intr&&days>365?'LTCG':intr?'Speculative':'STCG'});
   lot.qty-=Math.sign(lot.qty)*m;left-=m;if(lot.qty===0)q.shift()}
  if(left>0)q.push({qty:sgn*left,price:t.price,date:t.date})}
 const open=[];for(const [k,q] of Object.entries(Q))q.forEach(l=>{if(l.qty)open.push({sym:k.split('|')[0],seg:k.split('|')[1],qty:l.qty,price:l.price,date:l.date})});return {closed,open}}

function hvSeries(c,w){const r=c.map((x,i)=>i?Math.log(x/c[i-1]):null);const o=[];for(let i=0;i<c.length;i++){if(i<w){o.push(null);continue}let s=0,m=0;for(let j=i-w+1;j<=i;j++)m+=r[j];m/=w;for(let j=i-w+1;j<=i;j++)s+=(r[j]-m)**2;o.push(Math.sqrt(s/(w-1))*Math.sqrt(252))}return o}

import pandas as pd

def signal(df):
    """df: DataFrame with open, high, low, close, volume (index = date).
    Return a Series/array of positions: 1 = long, 0 = flat. Use only past data (no look-ahead)."""
    close = df["close"]
    fast, slow = close.rolling(20).mean(), close.rolling(100).mean()
    rsi = 100 - 100 / (1 + close.diff().clip(lower=0).rolling(14).mean() / (-close.diff().clip(upper=0)).rolling(14).mean())

    pullback = rsi < 60
    return (trend & pullback).astype(int).fillna(0)

function bondCalc(B){const n=B.years*B.freq,c=B.face*B.coupon/100/B.freq;const price=y=>{const r=y/100/B.freq;let p=0;for(let k=1;k<=n;k++)p+=c/Math.pow(1+r,k);return p+B.face/Math.pow(1+r,n)};const P=price(B.ytm);let lo=0.01,hi=40;for(let i=0;i<100;i++){const m=(lo+hi)/2;if(price(m)>B.price)lo=m;else hi=m}const ytmFromPrice=(lo+hi)/2;const r=B.ytm/100/B.freq;let mac=0;for(let k=1;k<=n;k++){const cf=k===n?c+B.face:c;mac+=k/B.freq*cf/Math.pow(1+r,k)}mac/=P;const mod=mac/(1+r);const dp=0.0001;const conv=(price(B.ytm-dp*100)+price(B.ytm+dp*100)-2*P)/(P*dp*dp);return {P,ytmFromPrice,mac,mod,conv,cy:c*B.freq/B.price,price}}

function fyBounds(d=new Date()){const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return {from:`${y}-04-01`,to:`${y+1}-03-31`,label:`FY${String(y+1).slice(2)}`,end:new Date(y+1,2,31)}}
function jrStats(){const E=S.jr.entries.filter(e=>e.exit&&e.entry&&e.qty);const pl=e=>(e.exit-e.entry)*e.qty*(e.side==='SELL'?-1:1);const R=e=>e.stop?((e.exit-e.entry)*(e.side==='SELL'?-1:1))/Math.abs(e.entry-e.stop):null;const grp=(key)=>{const m={};E.forEach(e=>{const ks=Array.isArray(e[key])?e[key]:[e[key]];ks.forEach(k=>{if(!k)return;const o=m[k]||(m[k]={n:0,pl:0,w:0});o.n++;o.pl+=pl(e);if(pl(e)>0)o.w++})});return m};return {E,pl,R,setup:grp('setup'),emo:grp('emo'),mist:grp('mist'),plan:grp('plan')}}
function harvest(){const fy=fyBounds();const {closed}=fifo(S.pnl.trades||[]);const inFy=closed.filter(t=>t.outDate>=fy.from&&t.outDate<=fy.to);const stg=inFy.filter(t=>t.term==='STCG').reduce((a,t)=>a+t.net,0),ltg=inFy.filter(t=>t.term==='LTCG').reduce((a,t)=>a+t.net,0);
 const today=new Date();const H=S.holdings.filter(h=>S.M[h.sym]).map(h=>{const m=S.M[h.sym];const days=h.date?Math.round((today-new Date(h.date))/86400000):null;const un=(m.price-h.avg)*h.qty;return {sym:h.sym,qty:h.qty,avg:h.avg,ltp:m.price,un,days,lt:days!=null&&days>365,verdict:m.verdict}});const tx=S.cfg.tax;
 const taxOf=(st,lt)=>Math.max(0,st)*tx.stcg/100+Math.max(0,lt-tx.exempt)*tx.ltcg/100;const base=taxOf(stg,ltg);
 const cands=H.filter(h=>h.un<0).map(h=>{let st=stg,lt=ltg;if(h.lt)lt+=h.un;else{const off=Math.min(Math.max(st,0),-h.un);st-=off;const rest=-h.un-off;lt-=rest}return Object.assign(h,{saving:base-taxOf(st,lt)})}).sort((a,b)=>b.saving-a.saving);
 const gainsLT=H.filter(h=>h.un>0&&h.lt);const room=Math.max(0,tx.exempt-Math.max(0,ltg));return {fy,stg,ltg,base,cands,H,room,gainsLT,daysLeft:Math.ceil((fy.end-today)/86400000)}}
function rebal(){const J=S.jr;const cur={'Large cap':0,'Mid cap':0,'Small cap':0,Debt:+J.other.Debt||0,Gold:+J.other.Gold||0,Cash:+J.other.Cash||0};S.holdings.filter(h=>S.M[h.sym]).forEach(h=>{const c=capClass(h.sym)||'Large';cur[c+' cap']=(cur[c+' cap']||0)+h.qty*S.M[h.sym].price});const tot=Object.values(cur).reduce((a,b)=>a+b,0)||1;return Object.keys(J.targets).map(k=>{const w=cur[k]/tot,t=J.targets[k]/100;return {k,val:cur[k],w,t,drift:w-t,trade:(t-w)*tot,breach:Math.abs(w-t)*100>J.band}}).concat([{k:'_tot',val:tot}])}
function goalSim(g){const R=rng(hash(g.name+g.years));const fv=g.target*Math.pow(1+g.infl/100,g.years);const N=1500,yrs=g.years;const paths=[];let ok=0;const mu=Math.log(1+g.ret/100)-0.5*(g.vol/100)**2,sg=g.vol/100;for(let s=0;s<N;s++){let v=g.corpus,sip=g.sip*12;const p=[v];for(let y=0;y<yrs;y++){v=(v+sip/2)*Math.exp(mu+sg*gauss(R))+sip/2;sip*=1+(g.step||0)/100;p.push(v)}if(v>=fv)ok++;paths.push(p)}const pct=q=>Array.from({length:yrs+1},(_,y)=>quantile(paths.map(p=>p[y]),q));
 const r=g.ret/100/12,n=yrs*12;const need=Math.max(0,(fv-g.corpus*Math.pow(1+r,n))*r/(Math.pow(1+r,n)-1));return {fv,prob:ok/N,p10:pct(0.1),p50:pct(0.5),p90:pct(0.9),need}}

S.ai={docs:[],q:'',ans:null,hits:[],busy:false,brief:null};
let _pdfjs=null;async function pdfLib(){if(_pdfjs)return _pdfjs;await new Promise((ok,bad)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=ok;sc.onerror=()=>bad(new Error('could not load pdf.js'));document.head.appendChild(sc)});_pdfjs=window.pdfjsLib;_pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';return _pdfjs}
const tokz=t=>t.toLowerCase().replace(/[^a-z0-9₹%.\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));const STOP=new Set('the and for with that this from are was were has have had our its their which will been into also than such these those there they them over under more most other about would could should can may per any all not but you your what when where how who why'.split(' '));
function chunkDoc(name,pages){const ch=[];pages.forEach((txt,pi)=>{const words=txt.replace(/\s+/g,' ').trim();for(let i=0;i<words.length;i+=1100){const t=words.slice(i,i+1300);if(t.length>80)ch.push({doc:name,page:pi+1,text:t,tok:tokz(t)})}});const df={};ch.forEach(c=>new Set(c.tok).forEach(w=>df[w]=(df[w]||0)+1));return {name,pages:pages.length,chunks:ch,df,avg:mean(ch.map(c=>c.tok.length))||1}}
function bm25(q,k=8){const qt=tokz(q);const out=[];S.ai.docs.forEach(D=>{const N=D.chunks.length;D.chunks.forEach(c=>{const tf={};c.tok.forEach(w=>tf[w]=(tf[w]||0)+1);let s=0;qt.forEach(w=>{if(!tf[w])return;const idf=Math.log(1+(N-(D.df[w]||0)+0.5)/((D.df[w]||0)+0.5));s+=idf*tf[w]*2.2/(tf[w]+1.2*(0.25+0.75*c.tok.length/D.avg))});if(s>0)out.push({c,s})})});return out.sort((a,b)=>b.s-a.s).slice(0,k)}
async function addPdf(file){try{toast('Reading '+esc(file.name)+'…');const lib=await pdfLib();const buf=await file.arrayBuffer();const pdf=await lib.getDocument({data:buf}).promise;const pages=[];for(let i=1;i<=Math.min(pdf.numPages,400);i++){const p=await pdf.getPage(i);const tc=await p.getTextContent();pages.push(tc.items.map(x=>x.str).join(' '))}S.ai.docs.push(chunkDoc(file.name,pages));toast(`${esc(file.name)}: ${pages.length} pages indexed`);renderAI()}catch(e){toast('PDF: '+esc(e.message),6000)}}
function addText(name,text){const pages=text.split(/\f|\n{3,}/).filter(x=>x.trim());S.ai.docs.push(chunkDoc(name||'Pasted text',pages.length?pages:[text]));renderAI()}
function hl(t,q){const ws=tokz(q).filter(w=>w.length>3);let h=esc(t);ws.forEach(w=>{h=h.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark style="background:#3b2f0a;color:#fde68a">$1</mark>')});return h}
async function askDoc(q){const A=S.ai;A.q=q;A.hits=bm25(q,10);if(!A.hits.length){A.ans={err:'No matching passages — try different words.'};renderAI();return}if(!S.bridge.ok){A.ans={err:'Showing the most relevant passages. Connect bridge.py with an Anthropic API key for a written, cited answer.'};renderAI();return}
 A.busy=true;A.ans=null;renderAI();const ctx=A.hits.map((h,i)=>`[${i+1}] (${h.c.doc}, p. ${h.c.page}) ${h.c.text}`).join('\n\n');try{const r=await bridgeFetch('/ai',{method:'POST',timeout:160000,body:JSON.stringify({task:'doc',prompt:q,context:ctx})});A.ans={text:r.answer,model:r.model}}catch(e){A.ans={err:e.message}}A.busy=false;renderAI()}

 if(!S.bridge.ok){A.brief={text:briefText(),local:true};renderAI();return}A.busy=true;renderAI();try{const r=await bridgeFetch('/ai',{method:'POST',timeout:160000,body:JSON.stringify({task:'brief',prompt:"Write today's pre-market brief.",context:ctx})});A.brief={text:r.answer,model:r.model}}catch(e){A.brief={text:'Error: '+e.message}}A.busy=false;renderAI()}

 else if(t.dataset.pst){const k=t.dataset.pst;S.res.portSel=t.checked?[...S.res.portSel,k]:S.res.portSel.filter(x=>x!==k)}
 else if(t.id==='idStream'){streamTicks(t.checked);renderIntraday()}
 else if(t.id==='foUnd'){S.foa.und=t.value;S.foa.bt.res=null;renderFoa();foLoad()}
 else if(t.id==='alType'){S._alType=t.value;S._alSym=$('#alSym').value;renderAlerts()}
 else if(t.dataset.alon!=null){S.al.rules[+t.dataset.alon].on=t.checked;saveAl()}
 else if(t.dataset.alch){S.al.channels[t.dataset.alch]=t.checked;saveAl()}
 else if(t.id==='alBrowser'){S.al.browser=t.checked;saveAl();if(t.checked&&'Notification' in window){try{Notification.requestPermission()}catch(e){}}}
 else if(t.id==='plFile'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{toast(importTradebook(r.result));S.pnl.view='all';renderPnl()};r.readAsText(f)}
 else if(t.id==='plFrom'||t.id==='plTo'){S.pnl[t.id==='plFrom'?'from':'to']=t.value;S.pnl.view='range';renderPnl()}
 else if(t.id==='nfTag'){S.newsF.tag=t.value;renderNews()}else if(t.id==='nfImp'){S.newsF.imp=t.value;renderNews()}else if(t.id==='nfQ'){S.newsF.q=t.value;renderNews()}
 else if(t.id==='fPx'){const fs=[...t.files];let msgs=[];let left=fs.length;fs.forEach(f=>{const r=new FileReader();r.onload=()=>{msgs.push(f.name+': '+importPrices(f.name,r.result));if(--left===0){computeAll();updateMode();$('#impMsg').textContent=msgs.join(' · ');fillDatalist()}};r.readAsText(f)})}
 else if(t.id==='fFund'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const msg=importFund(r.result);computeAll();updateMode();$('#impMsg').textContent=msg};r.readAsText(f)}
});
$('#search').addEventListener('change',e=>{const v=e.target.value.trim().toUpperCase();const s=S.bySym[v]||S.uni.find(x=>x.name.toUpperCase().includes(v));if(s){openSym(s.sym);e.target.value=''}});
$('#enqQ')&&0;$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.target.dispatchEvent(new Event('change'))}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
let rsT;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>render(),150)});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==S.tab)go(h,false)});
setInterval(()=>{if(!S.tick)return;Object.values(S.D).forEach(d=>{if(d.src.px!=='sim')return;const b=d.bars[d.bars.length-1];const R=Math.random;b.c=r2(b.c*(1+(R()+R()+R()-1.5)*0.004));b.h=Math.max(b.h,b.c);b.l=Math.min(b.l,b.c)});computeAll();checkPaper();if(['markets','rankings','algo','portfolio'].includes(S.tab))render()},3000);

/* ============================== Boot ============================== */
function showOpportunities(){const list=oppList(6);if(!list.length)return;
 modal(`<div class="h3" style="color:#4ade80;font-size:13px">▲ ${list.length} opportunit${list.length>1?'ies':'y'} flagged today — strong businesses trading well below their highs</div>
 <div class="sub" style="margin-bottom:10px">Quality ≥ 60, growth ≥ 50, profitable, ≥15% off the 52-week high (or −8% in 3 months) and below intrinsic value. ${dataMode().sim?'<b class="wa">Demo mode: based on simulated data.</b>':''}</div>${oppCards(list)}
 <div class="note">Click a card to open the company. A fall can reflect real problems — read the results and filings before acting. Not investment advice.</div>`)}
function boot(){buildNav();initUniverse();S.dates=genDates(756);S.uni.forEach(s=>{S.D[s.sym]=genSim(s)});genGlobal();fillDatalist();computeAll();updateMode();buildTape();clock();setInterval(clock,20000);
 const h=location.hash.slice(1);go(TABS.find(t=>t[0]===h)?h:'markets',false);
 if(!SS.get('dq_opp_seen',false)){SS.set('dq_opp_seen',true);setTimeout(showOpportunities,350)}
 if(S.bridge.url&&SS.get('dq_bridge',null)&&SS.get('dq_bridge',{}).token!==undefined){/* user reconnects manually */}}
boot();
</script>
