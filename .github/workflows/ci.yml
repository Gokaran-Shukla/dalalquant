name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r bridge/requirements.txt pytest
      - run: python -m pytest -q tests
      - run: python -c "import ast,sys; [ast.parse(open(f).read()) for f in ['bridge/bridge.py','bridge/nse_data.py','bridge/notify.py']]"
